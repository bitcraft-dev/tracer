[package]
name = "tracer-core"
description = "Tracer's core: the separate process every client (the Rux window, the CLI, AI agents) talks to."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tracer-protocol = { path = "../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = "3.5.0"
# Already in the build through ureq: a WebSocket's TLS, which ureq can't upgrade.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Already in the build through rustls: the OS's randomness, for tokens.
ring = "0.17"
# OpenAPI documents written in YAML, and a schema's `pattern`.
serde_yaml = "0.9"
regex-lite = "0.1"
